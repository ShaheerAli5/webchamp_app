name: webchamp_app
description: "A Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  go_router: ^16.2.0
  flutter_svg: ^2.2.0
  flutter_screenutil: ^5.9.3
  flutter_spinkit: ^5.2.2
  fluttertoast: ^8.2.12
  iconsax_flutter: ^1.0.1
  intl: ^0.20.2
  share_plus: ^11.0.0
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  audio_session: ^0.1.21
  record: ^5.2.0
  just_audio: ^0.10.4
  audio_waveforms: ^1.3.0
  audioplayers: ^6.1.0
  ffmpeg_kit_flutter_new: ^4.5.0
  path_provider: ^2.1.5
  agora_rtc_engine: ^6.4.0
  flutter_secure_storage: ^9.2.2
  intl_phone_field: ^3.2.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.2.0
  flutter_linkify: ^6.0.0
  any_link_preview: ^3.0.1
  video_player: ^2.8.0
  chewie: ^1.7.0
  visibility_detector: ^0.4.0+2
  emoji_picker_flutter: ^4.0.1
  open_filex: ^4.5.0
  device_info_plus: ^11.1.0
  video_thumbnail: ^0.5.6
  pdf: ^3.11.1
  local_auth: ^2.3.0
  photo_manager: ^3.3.0
  flutter_image_compress: ^2.3.0
  video_compress: ^3.1.2
  flutter_riverpod: ^2.5.1
  image_cropper: ^8.0.2
  camera: ^0.11.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

dependency_overrides:
  record_linux: ^1.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/bot replies.png
    - assets/images/message log.png
    - assets/images/settings.png
    - assets/images/subscription.png
    - assets/images/team member.png
    - assets/images/templates.png
    - assets/images/list.png
    - assets/images/logo.png
    - assets/images/AI-logo.png
    - assets/images/2-logo.png
    - assets/images/whatsapp_bg.png
